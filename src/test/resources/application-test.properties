# Configuration de test avec H2 en mémoire
spring.application.name=jappo-backend-test

# =========================
# DATABASE H2
# =========================
spring.datasource.url=jdbc:h2:mem:jappo_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =========================
# FLYWAY (désactivé pour les tests)
# =========================
spring.flyway.enabled=false

# =========================
# MAIL (valeurs par défaut pour les tests)
# =========================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.test-connection=false

# =========================
# JWT (configuration test)
# =========================
app.jwt.secret=test-secret-key-for-jwt-generation-minimum-256-bits-long-enough-for-hs256
app.jwt.expiration=86400000

# =========================
# SUPER ADMIN (configuration test)
# =========================
jappo.super-admin.email=admin@jappo.sn
jappo.super-admin.password=12345678
jappo.super-admin.prenom=Admin
jappo.super-admin.nom=JAPPO

# =========================
# AUTRES (valeurs par défaut pour les tests)
# =========================
app.frontend.url=http://localhost:4200
n8n.base-url=http://localhost:5678
ai.orchestrator.url=http://localhost:8080
ai.orchestrator.api-key=test-api-key
ai.orchestrator.timeout=30000
livekit.api-key=test-api-key
livekit.api-secret=test-api-secret
livekit.host=http://localhost

# =========================
# PAYDUNYA (configuration test)
# =========================
paydunya.master-key=test-master-key
paydunya.private-key=test-private-key
paydunya.token=test-token
paydunya.base-url=https://app.paydunya.com/sandbox-api/v1
paydunya.callback-url=http://localhost:4200/api/paiements/paydunya/ipn
paydunya.return-url=http://localhost:4200/paiement/succes
paydunya.cancel-url=http://localhost:4200/paiement/annule

# =========================
# ABONNEMENT (configuration test)
# =========================
app.abonnement.premium.prix=10000
app.abonnement.premium.duree-jours=30

# =========================
# GOOGLE (configuration test)
# =========================
app.google.client-id=test-google-client-id
